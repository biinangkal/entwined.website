<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Product Page</title>
        <link rel="stylesheet" href="entwined-styles.css"/>
    </head>
    <body>

        <div class="navbar-wrap">

            <header>
                <input type="text" placeholder="⌕" class="header-search"/>
                <div>
                    <a href="mainpage.html">
                        <img src="LOGO N SECTIONS/ENTWINED-logo-transparent.png" alt="LOGO" class="logo"/>
                    </a>
                </div>
                <div class="icon-group">
                    <a href="checkout-page.html" class="nav-cart">
                        <img src="Icon Elements/entwined-shopping-cart-icon.png" alt="cart" class="elements"/>
                    </a>
                </div>
            </header>

            <nav>
                <a href="shop-page.html"><u>Shop</u></a>
                <a href="custom-orders.html">Custom Orders</a>
                <a href="about-us.html">About Us</a>
                <a href="contact-us.html">Contact Us</a>
                <a href="checkout-page.html" class="nav-cart scrolled-cart">
                    <img src="Icon Elements/entwined-shopping-cart-icon.png" alt="cart" class="elements"/>
                </a>
            </nav>

        </div>

        <div class="product-page">
            <div class="product-image">
                <img src="Shop - Product Page - Related Products/entwined-lala-the-poodle-crochet.jpg" alt="Lala the Poodle"/>
            </div>

            <div class="product-details">
                <h1 class="product-title">LALA THE POODLE</h1>

                <div class="product-meta">
                    <p>Brand: ENTWINED</p>
                    <p>Product Dimensions: 5cm x 5cm</p>
                    <p>Material: 50% cotton / 50% acrylic</p>
                </div>

                <p class="product-price">&#8369; 295.00</p>

                <div class="product-controls">
                    <div class="control-group">
                        <label>Quantity:</label>
                        <div class="quantity-selector">
                            <button class="qty-btn" onclick="this.nextElementSibling.value--">-</button>
                            <input type="number" value="1" min="1"/>
                            <button class="qty-btn" onclick="this.previousElementSibling.value++">+</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Size:</label>
                        <input type="text" class="size-input"/>
                    </div>
                </div>

                <button class="add-to-cart">ADD TO CART</button>
            </div>
        </div>

        <!--RELATED-->

        <h2 class="related-heading">RELATED PRODUCTS</h2>
        <div class="shop-products">
            <div class="shop-product">
                <img src="Shop - Product Page - Related Products/entwined-harry-potter-crochet.png" alt="Product 1"/>
                <p class="product-name">PRODUCT NAME</p>
                <p class="product-price">₱ 500.00</p>
            </div>

            <div class="shop-product">
                <img src="Shop - Product Page - Related Products/entwined-lilo-n-stich-crochet.jpg" alt="Product 1"/>
                <p class="product-name">PRODUCT NAME</p>
                <p class="product-price">₱ 400.00</p>
            </div>

            <div class="shop-product">
                <img src="Shop - Product Page - Related Products/entwined-cozy-beanie-crochet.png" alt="Product 1"/>
                <p class="product-name">PRODUCT NAME</p>
                <p class="product-price">₱ 350.00</p>
            </div>
            <br/>
        </div>

        <footer>
            <div class="footer-logo">
                <img src="LOGO N SECTIONS/ENTWINED-logo-transparent.png" alt="Entwined"/>
            </div>
            <p class="footer-copy">©&thinsp;2026&nbsp;&nbsp;Entwined</p>
        </footer>

        <script src="script.js"></script>

    </body>
</html>
