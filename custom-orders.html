<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Custom Orders</title>
        <link rel="stylesheet" href="entwined-styles.css"/>
    </head>
    <body>

        <div class="navbar-wrap">

            <header>
                <input type="text" placeholder="⌕" class="header-search"/>
                <div>
                    <a href="mainpage.html">
                        <img src="LOGO N SECTIONS/ENTWINED-logo-transparent.png" alt="LOGO" class="logo"/>
                    </a>
                </div>
                <div class="icon-group">
                    <a href="checkout-page.html" class="nav-cart">
                        <img src="Icon Elements/entwined-shopping-cart-icon.png" alt="cart" class="elements"/>
                    </a>
                </div>
            </header>

            <nav>
                <a href="shop-page.html">Shop</a>
                <a href="custom-orders.html"><u>Custom Orders</u></a>
                <a href="about-us.html">About Us</a>
                <a href="contact-us.html">Contact Us</a>
                <a href="checkout-page.html" class="nav-cart scrolled-cart">
                    <img src="Icon Elements/entwined-shopping-cart-icon.png" alt="cart" class="elements"/>
                </a>
            </nav>

        </div>

        <section class="custom">
            <h2>CUSTOM ORDERS</h2>
            <div class="order-form">
                <div class="form-row">
                    <div class="input-group">
                        <label>Name:</label>
                        <input type="text"/>
                    </div>
                    <div class="input-group">
                        <label>Email Address:</label>
                        <input type="text"/>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Item Description:</label>
                        <textarea></textarea>
                    </div>
                    <div class="input-group">
                        <label>Special Notes:</label>
                        <textarea></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Color Preference:</label>
                        <input type="text"/>
                    </div>
                    <div class="input-group">
                        <label>Size:</label>
                        <input type="text"/>
                    </div>
                </div>

                <button class="submit-btn">SUBMIT ORDER</button>
            </div>
        </section>

        <!--FOOTER-->

        <footer>
            <div class="footer-logo">
                <img src="LOGO N SECTIONS/ENTWINED-logo-transparent.png" alt="Entwined" />
            </div>
            <p class="footer-copy">©&thinsp;2026&nbsp;&nbsp;Entwined</p>

        <script src="script.js"></script>
